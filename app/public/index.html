<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Messaging System</title>
  <style>
* {
  box-sizing: border-box;
}

:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  color: #202440;
  background: #f4f6fc;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 8% 0%, #e7eaff 0, transparent 32rem),
    radial-gradient(ellipse at 100% 100%, #e8f6ff 0, transparent 34rem),
    #f6f7fc;
}

main {
  width: min(1240px, calc(100% - 40px));
  margin: 0 auto;
  padding: 32px 0 44px;
  display: grid;
  grid-template-columns: minmax(255px, 0.78fr) minmax(0, 1.6fr);
  grid-template-areas:
    "heading heading"
    "status status"
    "user chat"
    "rooms chat";
  gap: 18px;
}

h1 {
  grid-area: heading;
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 0;
  color: #202440;
  font-size: clamp(1.6rem, 3vw, 2.15rem);
  line-height: 1.2;
  letter-spacing: -0.045em;
}

h1::before {
  content: "✦";
  display: grid;
  place-items: center;
  flex: 0 0 46px;
  width: 46px;
  height: 46px;
  color: white;
  font-size: 1.45rem;
  border-radius: 15px;
  background: linear-gradient(140deg, #7667f4, #4b8cf6);
  box-shadow: 0 7px 18px #7569e54a;
}

#status {
  grid-area: status;
  margin: 0;
  padding: 12px 16px;
  color: #4b5574;
  background: #ffffffd9;
  border: 1px solid #e5e8f4;
  border-radius: 13px;
  font-size: 0.91rem;
  box-shadow: 0 3px 12px #29376508;
}

.panel {
  min-width: 0;
  padding: 22px;
  margin: 0;
  background: #ffffffed;
  border: 1px solid #e9ebf5;
  border-radius: 20px;
  box-shadow: 0 10px 30px #25315c0b;
}

.panel h2 {
  margin: 0 0 17px;
  color: #292d4a;
  font-size: 1.04rem;
  font-weight: 750;
  letter-spacing: -0.02em;
}

.panel:nth-of-type(1) {
  grid-area: user;
}

.panel:nth-of-type(2) {
  grid-area: rooms;
}

.panel:nth-of-type(3) {
  grid-area: chat;
  display: flex;
  flex-direction: column;
  min-height: 620px;
}

input,
button {
  min-width: 0;
  font: inherit;
}

input {
  width: 100%;
  padding: 12px 14px;
  color: #242844;
  background: #fafbff;
  border: 1px solid #dfe3f0;
  border-radius: 12px;
  outline: none;
  transition: border-color 160ms ease, box-shadow 160ms ease,
    background 160ms ease;
}

input::placeholder {
  color: #9299b1;
}

input:focus {
  background: #fff;
  border-color: #8778f4;
  box-shadow: 0 0 0 4px #8272f41c;
}

button {
  min-height: 42px;
  padding: 10px 15px;
  color: #505978;
  background: #f2f4fb;
  border: 1px solid #e4e7f2;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 650;
  cursor: pointer;
  transition: transform 150ms ease, box-shadow 150ms ease,
    background 150ms ease, border-color 150ms ease;
}

button:hover:not(:disabled) {
  transform: translateY(-1px);
  border-color: #c9c9f7;
  background: #f1efff;
}

button:focus-visible {
  outline: 3px solid #8b7cf6;
  outline-offset: 3px;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.primary {
  color: #fff;
  background: linear-gradient(135deg, #7667ee, #5b7df1);
  border: 0;
  box-shadow: 0 5px 13px #6e6aeb30;
}

.primary:hover:not(:disabled) {
  color: #fff;
  background: linear-gradient(135deg, #6858e5, #4e70e8);
  box-shadow: 0 8px 18px #6e6aeb40;
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
}

.row input {
  flex: 1 1 100%;
  min-width: 0;
}

.row button {
  width: 100%;
}

#currentUser {
  margin: 15px 0 0;
  padding: 11px 12px;
  overflow-wrap: anywhere;
  color: #6258ad;
  background: #f2f0ff;
  border: 1px solid #e9e4ff;
  border-radius: 11px;
  font-size: 0.86rem;
  line-height: 1.5;
}

#roomForm {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}

#roomList {
  display: grid;
  gap: 8px;
  margin-top: 14px;
}

#roomList button {
  width: 100%;
  margin: 0;
  padding: 13px 14px;
  overflow-wrap: anywhere;
  text-align: left;
  color: #464d6c;
  background: #fafbff;
  border: 1px solid #e8ebf5;
  border-radius: 12px;
}

#roomList button::before {
  content: "#";
  margin-right: 9px;
  color: #8173ee;
  font-weight: 800;
}

#roomList button:hover {
  color: #594dc1;
  background: #f3f1ff;
}

#messages {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  min-height: 390px;
  max-height: min(62vh, 680px);
  padding: 19px;
  overflow-y: auto;
  overscroll-behavior: contain;
  background:
    radial-gradient(circle at 100% 0%, #eeedff 0, transparent 17rem),
    #f7f8fd;
  border: 1px solid #e9ebf6;
  border-radius: 16px;
  scrollbar-color: #c9cce1 transparent;
  scrollbar-width: thin;
}

.message {
  width: fit-content;
  max-width: min(86%, 580px);
  padding: 12px 15px;
  overflow-wrap: anywhere;
  background: #fff;
  border: 1px solid #e6e9f4;
  border-radius: 15px 15px 15px 5px;
  box-shadow: 0 3px 9px #202b4c08;
  line-height: 1.55;
}

.message strong {
  display: block;
  margin-bottom: 4px;
  color: #6255be;
  font-size: 0.84rem;
  font-weight: 750;
}

.message > div:not(.meta) {
  color: #292e49;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.meta {
  margin-top: 7px;
  color: #9298ad;
  font-size: 0.73rem;
  line-height: 1.4;
}

#messageForm {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  margin-top: 15px;
}

#messageInput {
  min-height: 48px;
  background: #fff;
  border-radius: 14px;
}

#sendButton {
  min-width: 90px;
  min-height: 48px;
  padding-inline: 19px;
}

@media (min-width: 761px) {
  #roomForm {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 760px) {
  main {
    width: min(100% - 24px, 620px);
    padding: 20px 0 28px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
      "heading"
      "status"
      "user"
      "rooms"
      "chat";
    gap: 13px;
  }

  h1 {
    gap: 10px;
    font-size: 1.55rem;
  }

  h1::before {
    flex-basis: 40px;
    width: 40px;
    height: 40px;
    border-radius: 13px;
  }

  .panel {
    padding: 17px;
    border-radius: 17px;
  }

  .panel:nth-of-type(3) {
    min-height: 530px;
  }

  #messages {
    min-height: 320px;
    max-height: 55vh;
    padding: 13px;
  }

  .message {
    max-width: 96%;
  }

  #messageForm {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  #sendButton {
    min-width: 68px;
    padding-inline: 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
  </style>
</head>
<body>
<main>
  <h1>Chat Messaging System</h1>
  <p id="status" role="status">Đang khởi tạo...</p>

  <section class="panel">
    <h2>1. Người dùng</h2>
    <form id="userForm" class="row">
      <input id="username" placeholder="Tên đăng nhập (3-32 ký tự)" required
             minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+">
      <input id="displayName" placeholder="Tên hiển thị" required maxlength="80">
      <button class="primary">Đăng ký / Cập nhật</button>
    </form>
    <p id="currentUser">Chưa chọn người dùng.</p>
  </section>

  <section class="panel">
    <h2>2. Phòng chat</h2>
    <form id="roomForm" class="row">
      <input id="roomName" placeholder="Tên phòng mới" required maxlength="80">
      <button class="primary">Tạo phòng</button>
    </form>
    <div id="roomList"></div>
  </section>

  <section class="panel">
    <h2 id="chatTitle">3. Tin nhắn</h2>
    <div id="messages" aria-live="polite"></div>
    <form id="messageForm" class="row">
      <input id="messageInput" placeholder="Nhập tin nhắn..." required maxlength="2000">
      <button class="primary" id="sendButton" disabled>Gửi</button>
    </form>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const status = $('status');
  const socket = io();
  let currentUser = null;
  let currentRoom = null;

  function setStatus(message) {
    status.textContent = message;
  }

  async function api(url, options = {}) {
    const response = await fetch(url, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...options.headers }
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Yêu cầu thất bại');
    return data;
  }

  function renderMessage(message) {
    const item = document.createElement('div');
    item.className = 'message';

    const author = document.createElement('strong');
    author.textContent = message.display_name || message.username || 'Người dùng';

    const body = document.createElement('div');
    body.textContent = message.content;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = new Date(message.created_at).toLocaleString('vi-VN');

    item.append(author, body, meta);
    $('messages').appendChild(item);
    $('messages').scrollTop = $('messages').scrollHeight;
  }

  async function loadRooms() {
    const data = await api('/api/rooms');
    const list = $('roomList');
    list.replaceChildren();

    if (!data.rooms.length) {
      list.textContent = 'Chưa có phòng chat.';
      return;
    }

    for (const room of data.rooms) {
      const button = document.createElement('button');
      button.textContent = `${room.name} (${room.member_count} thành viên)`;
      button.addEventListener('click', () => joinRoom(room));
      list.appendChild(button);
    }
  }

  async function joinRoom(room) {
    if (!currentUser) {
      setStatus('Hãy đăng ký hoặc chọn người dùng trước.');
      return;
    }

    try {
      await api(`/api/rooms/${room.id}/join`, {
        method: 'POST',
        body: JSON.stringify({ userId: currentUser.id })
      });

      currentRoom = room;
      $('chatTitle').textContent = `3. Tin nhắn — ${room.name}`;
      $('messages').replaceChildren();
      $('sendButton').disabled = false;

      const data = await api(
        `/api/rooms/${room.id}/messages?userId=${currentUser.id}`
      );
      data.messages.forEach(renderMessage);

      socket.emit('room:join', {
        roomId: room.id,
        userId: currentUser.id
      }, (result) => {
        if (!result?.ok) {
          setStatus(result?.error || 'Không thể kết nối phòng chat.');
          return;
        }
        setStatus(`Đã tham gia phòng: ${room.name}`);
      });
    } catch (error) {
      setStatus(error.message);
    }
  }

  socket.on('connect', () => setStatus('Đã kết nối máy chủ chat.'));
  socket.on('disconnect', () => setStatus('Mất kết nối, đang thử kết nối lại...'));

  socket.on('message:new', (message) => {
    if (currentRoom && Number(message.room_id) === Number(currentRoom.id)) {
      renderMessage(message);
    }
  });

  $('userForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    try {
      const data = await api('/api/users', {
        method: 'POST',
        body: JSON.stringify({
          username: $('username').value,
          displayName: $('displayName').value
        })
      });
      currentUser = data.user;
      $('currentUser').textContent =
        `Người dùng hiện tại: ${currentUser.display_name} (@${currentUser.username})`;
      setStatus('Đã lưu thông tin người dùng.');
    } catch (error) {
      setStatus(error.message);
    }
  });

  $('roomForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!currentUser) {
      setStatus('Hãy đăng ký hoặc chọn người dùng trước.');
      return;
    }

    try {
      const data = await api('/api/rooms', {
        method: 'POST',
        body: JSON.stringify({
          name: $('roomName').value,
          userId: currentUser.id
        })
      });
      $('roomName').value = '';
      await loadRooms();
      await joinRoom(data.room);
    } catch (error) {
      setStatus(error.message);
    }
  });

  $('messageForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!currentUser || !currentRoom) return;

    const input = $('messageInput');
    const content = input.value.trim();
    if (!content) return;

    try {
      await api(`/api/rooms/${currentRoom.id}/messages`, {
        method: 'POST',
        body: JSON.stringify({ userId: currentUser.id, content })
      });
      input.value = '';
    } catch (error) {
      setStatus(error.message);
    }
  });

  loadRooms().catch((error) => setStatus(error.message));

  api('/healthz')
    .then(() => setStatus('Máy chủ và PostgreSQL hoạt động bình thường.'))
    .catch(() => setStatus('Chưa kết nối được máy chủ hoặc PostgreSQL.'));
})();
</script>
</body>
</html>
